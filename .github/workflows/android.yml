name: Android APK

# Builds PdfCraft's browser version from source (scripts/build-web.sh) and packs it into a signed
# APK. Then, side by side, the Android shell around it runs in Chromium (scripts/test-shell.mjs)
# and the APK runs on an Android emulator (scripts/test-android.mjs). Every run uploads the APK as
# an artifact, whatever the shell test says; a push to main whose tests all pass also publishes
# it as a GitHub release, so the newest APK is always at
# https://github.com/<owner>/<repo>/releases/latest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Pinned: PdfCraft's lockfile pins wasm-bindgen, and a newer compiler can outrun it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the print PDF writer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          scripts/test-print-pdf.sh build/test-print

      - name: Test where saves go
        run: scripts/test-save-targets.sh

      # The wasm build compiles a few hundred crates; keep them between runs.
      - name: Cache the PdfCraft build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/target
            build/tools
            ~/.cache/trunk
          key: pdfcraft-wasm-${{ hashFiles('scripts/build-web.sh', 'patches/**') }}
          restore-keys: pdfcraft-wasm-

      # No fallback to the official prebuilt site here: it lacks patches/pdfcraft/, and a
      # release must never ship without them.
      - name: Build PdfCraft for the browser (wasm)
        env:
          PDFCRAFT_NO_FALLBACK: "1"
        run: scripts/build-web.sh

      - name: Build the APK
        env:
          # Optional: a private signing key instead of the committed sideload key.
          PDFCRAFT_KEYSTORE_B64: ${{ secrets.PDFCRAFT_KEYSTORE_B64 }}
          PDFCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          PDFCRAFT_KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          PDFCRAFT_KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
        run: |
          # Without the secrets, the committed sideload key signs (empty values count as unset).
          if [ -n "$PDFCRAFT_KEYSTORE_B64" ]; then
            echo "$PDFCRAFT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export PDFCRAFT_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-apk
          path: dist/*.apk
          if-no-files-found: error

      # What the shell test reads: the built site, the demo page it prints, and a form PDF.
      - uses: actions/upload-artifact@v4
        with:
          name: shell-test-inputs
          path: |
            build/web-assets/
            build/src/pdfcraft/assets/demo/showcase.html
            build/src/pdfcraft/crates/ui-egui/tests/data/form.pdf
          if-no-files-found: error
          retention-days: 3

  # Its own job, so a failure here shows red on the run without holding back the APK.
  shell:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: shell-test-inputs
          path: build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the shell around PdfCraft in Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/test-shell.mjs build/test-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: build/test-shots/
          if-no-files-found: ignore

  # The APK on a real Android runtime: Android 16 (API 36, targetSdk) with its own System
  # WebView. A google_apis image is a userdebug build, whose WebView lets the test attach to the
  # release APK's page.
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PdfCraft-apk
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The client only: it drives the app's own WebView, no browser download.
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test the APK on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disk-size: 6G
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          # One line: the action runs each line of `script` as its own `sh -c`.
          script: node scripts/test-android.mjs "$(ls dist/*.apk | head -n 1)" build/emulator

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator
          path: build/emulator/
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [apk, shell, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PdfCraft-apk
          path: dist

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: PdfCraft for Android (build ${{ github.run_number }})
          make_latest: true
          files: dist/*.apk
          body: |
            PdfCraft (storytold/pdfcraft, pinned release) packaged for Android.
            Download the APK on your phone, allow your browser or Files app to install unknown apps, and open it.
            Built from ${{ github.sha }}.
