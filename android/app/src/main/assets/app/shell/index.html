<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>PdfCraft</title>
  <style>
    :root { --bg: #f1f1f3; --fg: #1b1b1f; --muted: #5c5c66; --accent: #12a58a; --panel: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #19191c; --fg: #ececf1; --muted: #a0a0ab; --panel: #232327; }
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
    .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; background: var(--bg); text-align: center; }
    .overlay[hidden] { display: none; }
    #splash img { width: 96px; height: 96px; }
    #splash p { margin: 0; color: var(--muted); }
    .bar { width: 160px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--accent) 20%, transparent); overflow: hidden; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #error .card { max-width: 440px; width: 100%; background: var(--panel); border-radius: 16px; padding: 24px; box-sizing: border-box; }
    #error h1 { font-size: 20px; margin: 0 0 8px; }
    #error p { margin: 0 0 16px; }
    #error pre { margin: 0 0 20px; padding: 12px; border-radius: 8px; background: var(--bg); color: var(--muted);
      font-size: 12px; white-space: pre-wrap; text-align: left; overflow-wrap: anywhere; }
    #error .buttons { display: flex; flex-direction: column; gap: 8px; }
    button { font: inherit; padding: 12px 16px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <iframe id="app" title="PdfCraft" allow="clipboard-read; clipboard-write; fullscreen"></iframe>

  <div id="splash" class="overlay" role="status">
    <img src="icon.png" alt="">
    <div class="bar"></div>
    <p>Loading PdfCraft…</p>
  </div>

  <div id="error" class="overlay" hidden>
    <div class="card" role="alert">
      <h1>PdfCraft couldn't start</h1>
      <p id="error-text"></p>
      <pre id="error-info"></pre>
      <div class="buttons">
        <button id="wait" type="button" hidden>Keep waiting</button>
        <button id="retry" type="button">Try again</button>
        <button id="update" class="secondary" type="button">Update Android System WebView</button>
      </div>
    </div>
  </div>

  <script src="shell.js"></script>
</body>
</html>
